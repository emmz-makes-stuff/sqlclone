# Publishes the sqlclone tool to nuget.org when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The package version comes from the tag. Authentication uses nuget.org trusted publishing: GitHub's OIDC token is
# exchanged for a short-lived API key. The policy on nuget.org must name this file (publish.yaml). The NUGET_USER
# repository secret holds the nuget.org profile name (not the email address).

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login request a GitHub OIDC token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}

      # Starts SQL Server 2025 containers with Testcontainers; the runner has Docker.
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/SqlClone -c Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/SqlClone.${{ steps.version.outputs.version }}.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
